<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="utf-8">
    <title>Palindrome Checker</title>
    <link rel="stylesheet" href="palindromeChecker.css">
</head>

<body>
    <h2>Palindrome Checker</h2>
    <hr>
    <div class="main-c">
    <input id="text-input" placeholder="Enter Your Word Here...">
    <button id="check-btn">Check</button>
    <p id="result"></p>
    <div id="meaning">
    <p>💡A palindrome is a word, phrase, number, or sequence of characters that reads the same forward and backward (ignoring spaces, punctuation, and capitalization in some cases).⭐</p>
    </div>
    </div>
<script src="palindromeChecker.js"></script>
</body>
